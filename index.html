<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="static/favicon.svg">
  <link rel="stylesheet" href="static/styles.css">
  <title>업무 포털</title>
</head>
<body data-tools-url="config/tools.json">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="업무 포털 홈">
        <span class="brand-mark">W</span>
        <span>Work Portal</span>
      </a>
      <span class="access-badge protected" id="portalAccessBadge">사내 Git 인증</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">TEAM WORKSPACE</p>
        <h1 id="portalTitle">업무 포털</h1>
        <p id="portalSubtitle">업무 도구와 공개 정보 기반 참고 자료를 한곳에서 확인하세요.</p>
      </div>
      <div class="hero-count"><strong id="contentCount">0</strong><span id="contentCountLabel">사용 가능한 도구</span></div>
    </section>

    <nav class="portal-nav" aria-label="업무 포털 메뉴">
      <button class="portal-tab active" type="button" data-section="tools" aria-selected="true" aria-controls="contentGrid">
        <span>업무 도구</span><small>반복 업무를 빠르게 처리하는 기능</small>
      </button>
      <button class="portal-tab" type="button" data-section="references" aria-selected="false" aria-controls="contentGrid">
        <span>인사이트 라이브러리</span><small>공개 정보 기반 보고서와 분석 자료</small>
      </button>
    </nav>

    <section class="section-heading" aria-live="polite">
      <p class="section-kicker" id="sectionKicker">WORK TOOLS</p>
      <h2 id="sectionTitle">업무 도구</h2>
      <p id="sectionDescription">업무에 필요한 기능을 바로 실행할 수 있습니다.</p>
    </section>

    <section class="toolbar" aria-label="콘텐츠 검색 및 필터">
      <label class="search-field">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="도구명, 설명, 태그 검색" autocomplete="off">
      </label>
      <div class="category-filter" id="categoryFilter" role="group" aria-label="카테고리"></div>
    </section>

    <section class="notice" id="portalNotice" aria-label="이용 안내"></section>
    <section class="notice policy-notice" id="sectionNotice" aria-label="등록 기준" hidden></section>
    <section class="tool-grid" id="contentGrid" aria-live="polite"></section>
    <section class="empty-state" id="emptyState" hidden>
      <strong id="emptyTitle">검색 결과가 없습니다.</strong>
      <span id="emptyDescription">다른 검색어나 카테고리를 선택해 주세요.</span>
    </section>
  </main>

  <footer>
    <span>Work Portal</span>
    <span>도구와 참고 자료는 <code>config/tools.json</code>에서 관리합니다.</span>
  </footer>
  <script src="static/app.js?v=20260826-5" defer></script>
</body>
</html>
